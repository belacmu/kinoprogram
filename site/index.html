<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kino by Film</title>
<meta name="description" content="Every film showing in Oslo cinemas, browsed by film instead of by date.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Kino <span>by film</span></h1>
      <nav class="regions" id="regions" aria-label="Region"></nav>
      <div class="sub" id="sub">Loading the programme…</div>
    </div>
    <button class="btn ghost" id="accountBtn" hidden>Sign in</button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Search for a film, director or series" autocomplete="off">
      <select id="view" aria-label="View"></select>
    </div>
    <div class="row" id="filterRow">
      <span class="seg" id="tix" role="group" aria-label="Tickets"></span>
      <button class="chip" id="watchBtn" aria-pressed="false">★ Watchlist</button>
      <button class="chip" id="dubBtn" aria-pressed="false">Hide Norwegian dubs</button>
      <button class="chip" id="enBtn" aria-pressed="false">English subtitles</button>
      <button class="chip" id="cinemaBtn" aria-expanded="false">All cinemas ▾</button>
      <button class="chip" id="kindBtn" aria-expanded="false">All types ▾</button>
    </div>
    <div class="row cinemas" id="cinemas" hidden></div>
    <div class="row cinemas" id="kinds" hidden></div>
    <nav class="jump" id="jump" aria-label="Jump to section"></nav>
  </div>

  <div class="count" id="count"></div>
  <div id="grid"></div>
  <footer class="foot" id="foot"></footer>
</div>

<dialog id="film" aria-labelledby="filmTitle"></dialog>

<dialog id="account" aria-labelledby="accountTitle">
  <form method="dialog" class="dlg-close"><button class="x" aria-label="Close">×</button></form>
  <div id="accountBody"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
