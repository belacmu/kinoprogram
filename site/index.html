<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kino by Film</title>
<meta name="description" content="Every film showing in Oslo cinemas, browsed by film instead of by date.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Kino <span>by film</span></h1>
      <nav class="regions" id="regions" aria-label="Region"></nav>
      <div class="sub" id="sub">Loading the programme…</div>
    </div>
    <button class="btn ghost" id="accountBtn" hidden>Sign in</button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="btn ghost small" id="filtersDone">Done</button>
      </div>
      <div id="filtersBody"></div>
    </aside>

    <main class="main">
      <div class="controls" id="controls">
        <div class="row">
          <input type="search" id="q" placeholder="Search for a film, director or series" autocomplete="off">
          <select id="view" aria-label="View"></select>
          <button class="chip" id="watchBtn" aria-pressed="false" title="Show only films on your watchlist">★ Watchlist</button>
          <button class="chip" id="filtersBtn" aria-controls="filters" aria-expanded="false">Filters</button>
        </div>
        <nav class="jump" id="jump" aria-label="Jump to section"></nav>
      </div>
      <div class="count" id="count"></div>
      <div id="grid"></div>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<dialog id="film" aria-labelledby="filmTitle"></dialog>

<dialog id="account" aria-labelledby="accountTitle">
  <form method="dialog" class="dlg-close"><button class="x" aria-label="Close">×</button></form>
  <div id="accountBody"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
