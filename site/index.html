<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinecrab</title>
<meta name="description" content="Stay up to date with film releases in your cinemas: what's playing, what just went on sale, and a watchlist that emails you when tickets open. Oslo, Westman and Costa del Sol.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cinecrab">
<meta property="og:title" content="Cinecrab: stay up to date with film releases in your cinemas">
<meta property="og:description" content="What's playing, what just went on sale, and a watchlist that emails you when tickets open. Oslo, Westman and Costa del Sol.">
<meta property="og:url" content="https://belacmu.github.io/kinoprogram/">
<meta property="og:image" content="https://belacmu.github.io/kinoprogram/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cinecrab">
<meta name="application-name" content="Cinecrab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Cinecrab</h1>
    <div class="topright">
      <button class="pill" id="newsBtn" aria-haspopup="dialog" aria-label="What's new">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/></svg>
        <span class="lbl">What's new</span>
      </button>
      <div class="dd" id="regionDD">
        <button class="pill" id="regionBtn" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="menu right" id="regionMenu" role="menu" hidden></div>
      </div>
      <button class="pill" id="accountBtn" hidden>Sign in</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="layout">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="grab" aria-hidden="true"></div>
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="btn ghost small" id="filtersDone">Done</button>
      </div>
      <div id="filtersBody"></div>
      <div class="filters-foot">
        <button class="btn ghost small" id="filtersReset" data-f="reset">Reset</button>
        <button class="btn accent" id="filtersShow">Show films</button>
      </div>
    </aside>

    <main class="main">
      <div class="controls" id="controls">
        <div class="listswitch" id="listSwitch" role="group" aria-label="Which films">
          <button data-list="all" aria-pressed="true">All films</button>
          <button data-list="watch" aria-pressed="false">♥ Watchlist<span id="wlCount"></span></button>
        </div>
        <div class="bar">
          <button class="iconbtn" id="searchBtn" aria-label="Search" aria-controls="searchBox" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="searchbox" id="searchBox">
            <input type="search" id="q" placeholder="Search for a film, director or series" autocomplete="off" aria-label="Search">
            <button class="iconbtn" id="searchClose" aria-label="Close search">×</button>
          </div>
          <div class="dd" id="dayDD">
            <button class="pill" id="dayBtn" aria-haspopup="dialog" aria-expanded="false"></button>
            <div class="menu cal" id="calMenu" role="dialog" aria-label="Pick a day" hidden></div>
          </div>
          <button class="pill" id="filtersBtn" aria-controls="filters" aria-expanded="false">Filters</button>
        </div>
      </div>
      <div id="grid"></div>
    </main>
  </div>

  <footer class="foot"><div class="sub" id="sub">Loading the programme…</div><div id="foot"></div></footer>
</div>

<div id="toast" popover="manual" role="status" aria-live="polite"></div>

<dialog id="news" aria-labelledby="newsTitle"></dialog>

<dialog id="film" aria-labelledby="filmTitle"></dialog>

<dialog id="account" aria-labelledby="accountTitle">
  <form method="dialog" class="dlg-close"><button class="x" aria-label="Close">×</button></form>
  <div id="accountBody"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
