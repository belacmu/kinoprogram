<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinecrab</title>
<meta name="description" content="Cinecrab: every film showing in your city, browsed by film instead of by date.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Cinecrab</h1>
      <nav class="regions" id="regions" aria-label="Region"></nav>
      <div class="sub" id="sub">Loading the programme…</div>
    </div>
    <button class="btn ghost" id="accountBtn" hidden>Sign in</button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="btn ghost small" id="filtersDone">Done</button>
      </div>
      <div id="filtersBody"></div>
      <div class="filters-foot">
        <button class="btn ghost small" id="filtersReset" data-f="reset">Reset</button>
        <button class="btn accent" id="filtersShow">Show films</button>
      </div>
    </aside>

    <main class="main">
      <div class="controls" id="controls">
        <div class="bar">
          <button class="iconbtn" id="searchBtn" aria-label="Search" aria-controls="searchBox" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <div class="searchbox" id="searchBox">
            <input type="search" id="q" placeholder="Search for a film, director or series" autocomplete="off" aria-label="Search">
            <button class="iconbtn" id="searchClose" aria-label="Close search">×</button>
          </div>
          <select id="view" aria-label="Group films by"></select>
          <button class="chip watch" id="watchBtn" aria-pressed="false">★ Watchlist</button>
          <button class="chip" id="filtersBtn" aria-controls="filters" aria-expanded="false">Filters</button>
        </div>
      </div>
      <nav class="jump" id="jump" aria-label="Jump to section"></nav>
      <div class="count" id="count"></div>
      <div id="grid"></div>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<dialog id="film" aria-labelledby="filmTitle"></dialog>

<dialog id="account" aria-labelledby="accountTitle">
  <form method="dialog" class="dlg-close"><button class="x" aria-label="Close">×</button></form>
  <div id="accountBody"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
