<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinecrab</title>
<meta name="description" content="Stay up to date with film releases in your cinemas: what's playing, what just went on sale, and a watchlist that emails you when tickets open. Oslo, Westman, Winnipeg and Costa del Sol.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cinecrab">
<meta property="og:title" content="Cinecrab: stay up to date with film releases in your cinemas">
<meta property="og:description" content="What's playing, what just went on sale, and a watchlist that emails you when tickets open. Oslo, Westman, Winnipeg and Costa del Sol.">
<meta property="og:url" content="https://belacmu.github.io/kinoprogram/">
<meta property="og:image" content="https://belacmu.github.io/kinoprogram/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Cinecrab">
<meta name="application-name" content="Cinecrab">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Cinecrab</h1>
    <nav class="mainnav" id="mainNav" aria-label="Main">
      <a href="#feed" data-page="feed"><span class="ni"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 0 1 8 8M4 5a14 14 0 0 1 14 14M5 19h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><i class="navdot" id="feedDot" hidden></i></span><span class="nl">Feed</span></a>
      <a href="#films" data-page="films"><span class="ni"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 5v14M17 5v14M3 10h4M3 14h4M17 10h4M17 14h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nl">Films</span></a>
    </nav>
    <div class="topright">
      <div class="dd" id="regionDD">
        <button class="pill" id="regionBtn" aria-haspopup="menu" aria-expanded="false"></button>
        <div class="menu right" id="regionMenu" role="menu" hidden></div>
      </div>
      <div class="dd" id="acctDD" hidden>
        <button class="pill" id="accountBtn" aria-haspopup="dialog" aria-expanded="false">Sign in</button>
        <div class="menu right" id="acctMenu" role="menu" aria-label="Account" hidden></div>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="layout">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="grab" aria-hidden="true"></div>
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="btn ghost small" id="filtersDone">Done</button>
      </div>
      <div id="filtersBody"></div>
      <div class="filters-foot">
        <button class="btn ghost small" id="filtersReset" data-f="reset">Reset</button>
        <button class="btn accent" id="filtersShow">Show films</button>
      </div>
    </aside>

    <main class="main">
      <div id="feedPage" class="feed" hidden></div>
      <div class="controls" id="controls">
        <div class="switchrow">
          <div class="listswitch" id="listSwitch" role="group" aria-label="Which films">
            <button data-list="all" aria-pressed="true">All films<span class="cnt"></span></button>
            <button data-list="watch" aria-pressed="false"><span class="ico" aria-hidden="true">♥</span>Watchlist<span class="cnt"></span></button>
            <button data-list="friends" aria-pressed="false"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.3a3.5 3.5 0 0 1 0 6.4M18 14.4c2 .7 3.5 2.4 3.5 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Friends<span class="cnt"></span></button>
          </div>
          <button type="button" class="addfriend" id="addFriendBtn" aria-label="Add a friend" title="Add a friend" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M19 8v6M16 11h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="toolrow">
          <div class="filterrow">
          <button class="pill" id="filtersBtn" aria-controls="filters" aria-expanded="false">Filters</button>
          <div class="activechips" id="activeChips" aria-label="Filters in use" hidden><div class="chiplist" id="chipList"></div><button type="button" class="linkbtn" id="chipsClear" data-chip="all">Clear all</button></div>
          </div>
          <div class="bar">
            <div class="searchbox" id="searchBox">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <input type="search" id="q" placeholder="Search films, directors, series" autocomplete="off" aria-label="Search">
              <button type="button" class="qclear" id="qClear" aria-label="Clear search" hidden><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
            </div>
            <div class="dd" id="dayDD">
              <button class="pill" id="dayBtn" aria-haspopup="dialog" aria-expanded="false"></button>
              <div class="menu cal" id="calMenu" role="dialog" aria-label="Pick a day" hidden></div>
            </div>
          </div>
        </div>
      </div>
      <div class="fpanel wlinvite" id="wlInvite" hidden></div>
      <div class="fpanel" id="friendsPanel" hidden></div>
      <div id="grid"></div>
      <p class="hiddenkinds" id="hiddenKinds" hidden></p>
    </main>
  </div>

  <footer class="foot"><div class="sub" id="sub">Loading the programme…</div><div id="foot"></div><div class="foot-links"><button type="button" class="linkbtn" id="prefsLink">Preferences</button></div></footer>
</div>

<div id="toast" popover="manual" role="status" aria-live="polite"></div>


<dialog id="film" aria-labelledby="filmTitle"></dialog>
<dialog id="zoom" aria-label="Poster"></dialog>

<dialog id="friendsAdd" aria-label="Add a friend">
  <form method="dialog" class="dlg-close"><button class="x" aria-label="Close">×</button></form>
  <div id="friendsAddBody"></div>
</dialog>

<dialog id="account" aria-labelledby="accountTitle">
  <form method="dialog" class="dlg-close"><button class="x" aria-label="Close">×</button></form>
  <div id="accountBody"></div>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
