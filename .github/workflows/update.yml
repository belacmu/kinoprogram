name: Update programme

on:
  schedule:
    # UTC. 07:00/08:00 cover 09:00 Oslo (summer/winter), 14:00/15:00 cover 09:00 Manitoba.
    # digest.py only sends after 09:00 local and once per day per region; other runs refresh the site.
    - cron: "0 3,7,8,11,14,15,19 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Also run the daily email (still only after 09:00 Oslo and once per day)"
        type: boolean
        default: false
      test_email:
        description: "Send a sample digest to this address (doesn't affect the real digest)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Landmark Brandon via a Canadian VPN (once a day)
        continue-on-error: true  # if this fails, Westman falls back to CinemaClock for Landmark
        env:
          WG_CONF: ${{ secrets.SURFSHARK_WG_CONF }}
        run: |
          if [ -z "$WG_CONF" ]; then echo "No VPN config set; Landmark comes from CinemaClock."; exit 0; fi
          if [ "$(python scraper/westman.py needs-landmark)" != "yes" ]; then echo "Landmark already fetched today."; exit 0; fi
          sudo apt-get install -y -qq wireguard-tools > /dev/null
          # Drop the DNS line (needs resolvconf on the runner); only the one fetch goes through the tunnel.
          printf '%s\n' "$WG_CONF" | grep -viE '^\s*DNS\s*=' | sudo tee /etc/wireguard/kino.conf > /dev/null
          sudo wg-quick up kino
          code=$(curl -s --max-time 60 -o /tmp/landmark.html -w "%{http_code}" \
            -A "Mozilla/5.0 (kinoprogram; personal use, once a day; +https://github.com/belacmu/kinoprogram)" \
            https://www.landmarkcinemas.com/showtimes/brandon || echo 000)
          sudo wg-quick down kino
          echo "Landmark responded $code"
          if [ "$code" = "200" ]; then python scraper/westman.py extract-landmark /tmp/landmark.html; fi

      - name: Fetch showings
        id: build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python scraper/build.py

      - name: Write site config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'window.KINO_CONFIG = { supabaseUrl: "%s", supabaseKey: "%s" };\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > site/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Daily email
        if: github.event_name == 'schedule' || inputs.digest
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scraper/digest.py --scheduled

      - name: Test email
        if: inputs.test_email != ''
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python scraper/digest.py --to "$TEST_EMAIL"

      - name: Save state
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update state"
          git pull --rebase --autostash
          git push
