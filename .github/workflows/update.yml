name: Update programme

on:
  schedule:
    # UTC. Oslo is refreshed on every run; Westman, Winnipeg and Costa del Sol twice a day each, by their local clocks (scraper/due.py);
    # other runs reuse their cached data. 07:00/08:00 cover 09:00 Oslo, 07:00/08:00 Spain, 14:00/15:00 Manitoba (summer/winter).
    # digest.py only sends after 09:00 local and once per day per region, and only for regions refreshed in the run.
    - cron: "0 3,7,8,11,14,15,19 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Also run the daily email (still only after 09:00 Oslo and once per day)"
        type: boolean
        default: false
      test_email:
        description: "Send a sample digest to this address (doesn't affect the real digest)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore other regions' data
        uses: actions/cache@v4
        with:
          path: |
            site/data/westman.json
            site/data/winnipeg.json
            site/data/costadelsol.json
          key: region-data-${{ github.run_id }}
          restore-keys: region-data-

      # Oslo is refreshed on every run. Westman, Winnipeg and Costa del Sol change slowly: scraper/due.py picks them twice a day
      # by their own local clock (first run after 09:00 local, and after an evening hour), and every manual run does all.
      - name: Choose regions
        id: regions
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "list=oslo westman winnipeg costadelsol" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(python scraper/due.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch showings
        id: build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          list="${{ steps.regions.outputs.list }}"
          # A region's data file is missing (first run or expired cache): build it too, or the site would lose it.
          [ -f site/data/westman.json ] || list="$list westman"
          [ -f site/data/winnipeg.json ] || list="$list winnipeg"
          [ -f site/data/costadelsol.json ] || list="$list costadelsol"
          list=$(printf '%s\n' $list | sort -u | tr '\n' ' ')
          echo "regions=$list" >> "$GITHUB_OUTPUT"
          python scraper/build.py $list

      - name: Write site config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: sh scripts/write-site-config.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Daily email
        if: github.event_name == 'schedule' || inputs.digest
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scraper/digest.py --scheduled --only "${{ steps.build.outputs.regions }}"

      - name: Test email
        if: inputs.test_email != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python scraper/digest.py --to "$TEST_EMAIL"

      - name: Save state
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update state"
          git pull --rebase --autostash -X theirs  # on a clash, keep this (newer) run's state
          git push
