name: Update programme

on:
  schedule:
    # UTC. Oslo is refreshed on every run; Westman, Winnipeg and Costa del Sol twice a day each, by their local clocks (scraper/due.py);
    # other runs reuse their cached data. 07:00/08:00 cover 09:00 Oslo, 07:00/08:00 Spain, 14:00/15:00 Manitoba (summer/winter).
    # digest.py only sends after 09:00 local and once per day per region, and only for regions refreshed in the run.
    # Not on the hour: GitHub delays and drops scheduled runs at :00 most (in November 2026 only ~3 of these 7 a day ran, 1-3 h late).
    - cron: "17 3,7,8,11,14,15,19 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Also run the daily email (still only after 09:00 Oslo and once per day)"
        type: boolean
        default: false
      test_email:
        description: "Send a sample digest to this address (doesn't affect the real digest)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every region's last data file: regions not refreshed in this run reuse it, and build.py compares a refreshed region with it
      # (a region that fails, or suddenly has under half its films, keeps its last data).
      - name: Restore the regions' last data
        uses: actions/cache@v4
        with:
          path: site/data/*.json
          key: region-data-${{ github.run_id }}
          restore-keys: region-data-

      # Oslo is refreshed on every run. Westman, Winnipeg and Costa del Sol change slowly: scraper/due.py picks them twice a day
      # by their own local clock (first run after 09:00 local, and after an evening hour), and every manual run does all.
      - name: Choose regions
        id: regions
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "list=$(python3 scripts/regions.py keys)" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(python scraper/due.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch showings
        id: build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # Films and showings are written to Supabase (scraper/filmids.py); if that fails the run carries on.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          list="${{ steps.regions.outputs.list }}"
          # A region's data file is missing (first run or expired cache): build it too, or the site would lose it.
          while read -r region file; do [ -f "site/data/$file" ] || list="$list $region"; done < <(python3 scripts/regions.py pairs)
          list=$(printf '%s\n' $list | sort -u | tr '\n' ' ')
          # build.py writes the outputs "regions" (the regions it refreshed) and "failed" (those that kept their last data).
          python scraper/build.py $list

      - name: Write site config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          HCAPTCHA_SITE_KEY: ${{ vars.HCAPTCHA_SITE_KEY }}
        run: sh scripts/write-site-config.sh

      - name: Write film preview pages
        run: python3 scripts/write-film-pages.py

      - name: Add the preview branch
        run: sh scripts/add-preview.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4

      # The email doesn't need the site deploy to have worked (it links to the site, which keeps its last version).
      - name: Daily email
        if: (github.event_name == 'schedule' || inputs.digest) && !cancelled() && steps.build.outcome == 'success'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scraper/digest.py --scheduled --only "${{ steps.build.outputs.regions }}"

      - name: Test email
        if: inputs.test_email != '' && !cancelled() && steps.build.outcome == 'success'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python scraper/digest.py --to "$TEST_EMAIL"

      - name: Save state
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update state"
          git pull --rebase --autostash -X theirs  # on a clash, keep this (newer) run's state
          git push

      # A region that failed kept its last data, and everything else went ahead; mark the run failed so it shows (and GitHub emails).
      - name: Report regions that failed
        if: always() && steps.build.outputs.failed != ''
        run: |
          echo "::error::These regions kept their last data: ${{ steps.build.outputs.failed }} (see the Fetch showings step)"
          exit 1
