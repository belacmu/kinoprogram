name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.cinemaclock.com/movie-theaters/landmark-9-brandon" \
                   "https://www.cinemaclock.com/movie-theaters/evans-theatre" \
                   "https://evanstheatre.ca/upcoming-movies/"; do
            code=$(curl -s -o body.txt -w "%{http_code}" -A "Mozilla/5.0 (kinoprogram; +https://github.com/belacmu/kinoprogram)" "$u")
            echo "RESULT $code $u $(wc -c < body.txt) bytes, movietitle=$(grep -c 'movietitle' body.txt) cf_challenge=$(grep -ci 'cf-chl\|challenge-platform\|Just a moment' body.txt)"
          done
